<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="amberOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.28" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
        fill: #f8fafc;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.4px;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 6 6;
        animation: flow 20s linear infinite;
      }
      .float-orb1 {
        animation: float1 7s ease-in-out infinite alternate;
      }
      .float-orb2 {
        animation: float2 9s ease-in-out infinite alternate;
      }
      @keyframes flow {
        from { stroke-dashoffset: 240; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes float1 {
        0% { transform: translate(0, 0); }
        100% { transform: translate(30px, 20px); }
      }
      @keyframes float2 {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-25px, -15px); }
      }
      @keyframes pulse {
        0% { opacity: 0.35; transform: scale(0.97); }
        100% { opacity: 0.75; transform: scale(1.03); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Animated Glowing Orbs (in Background behind content) -->
  <g class="float-orb1" opacity="0.45">
    <circle cx="220" cy="90" r="130" fill="#38bdf8" filter="url(#glowCyan)" opacity="0.3" />
  </g>
  <g class="float-orb2" opacity="0.4">
    <circle cx="980" cy="330" r="160" fill="#a855f7" filter="url(#glowPurple)" opacity="0.35" />
    <circle cx="1060" cy="110" r="100" fill="#06b6d4" filter="url(#glowCyan)" opacity="0.2" />
  </g>

  <!-- Decorative Circuit / Flow Lines (Background Layer) -->
  <path d="M 60 350 L 320 350 L 380 390 L 820 390 L 880 350 L 1140 350" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" class="dash-flow" />
  <path d="M 120 70 L 450 70 L 510 30 L 900 30 L 960 70 L 1120 70" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.25" class="dash-flow" />

  <!-- Flow Status Nodes -->
  <circle cx="380" cy="390" r="4" fill="#38bdf8" />
  <circle cx="820" cy="390" r="4" fill="#a855f7" />
  <circle cx="510" cy="30" r="4" fill="#34d399" />
  <circle cx="900" cy="30" r="4" fill="#f43f5e" />

  <!-- Central Foreground Content Card (Solid with border for high contrast) -->
  <rect x="80" y="55" width="1040" height="310" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Top Category Indicator Pill -->
  <g transform="translate(120, 90)">
    <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="pill-text" fill="#38bdf8">ENTERPRISE ITSM &amp; ITOM ECOSYSTEM</text>
  </g>

  <!-- Live Pulse Badge on right -->
  <g transform="translate(930, 90)">
    <rect width="150" height="32" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="20" cy="16" r="5" fill="#10b981">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="21" class="pill-text" fill="#34d399">VERIFIED 2026</text>
  </g>

  <!-- MAIN TITLE (Foreground - Ultra Sharp & Clear) -->
  <text x="120" y="170" class="title-text">Awesome IT Service Management</text>
  <text x="120" y="215" class="title-text" fill="url(#cyanBlue)">&amp; Operations (ITOM)</text>

  <!-- SUBTITLE -->
  <text x="120" y="258" class="subtitle-text">
    Curated SaaS Platforms, Sovereign Open-Source Tools, CMDBs, Runbooks &amp; ITIL Automation
  </text>

  <!-- INTERACTIVE / FLOW FEATURE PILLS (Bottom inside card) -->
  <!-- Pill 1: Incident & ITIL -->
  <g transform="translate(120, 292)">
    <rect width="180" height="42" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="22" cy="21" r="6" fill="#38bdf8" />
    <text x="38" y="26" class="pill-text" fill="#f1f5f9">ITIL &amp; Service Desk</text>
  </g>

  <!-- Pill 2: ITOM & CMDB -->
  <g transform="translate(315, 292)">
    <rect width="180" height="42" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="22" cy="21" r="6" fill="#818cf8" />
    <text x="38" y="26" class="pill-text" fill="#f1f5f9">CMDB &amp; ITAM Assets</text>
  </g>

  <!-- Pill 3: Runbook Automation -->
  <g transform="translate(510, 292)">
    <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="22" cy="21" r="6" fill="#a855f7" />
    <text x="38" y="26" class="pill-text" fill="#f1f5f9">Runbook Automation</text>
  </g>

  <!-- Pill 4: SRE & AIOps -->
  <g transform="translate(725, 292)">
    <rect width="170" height="42" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="22" cy="21" r="6" fill="#10b981" />
    <text x="38" y="26" class="pill-text" fill="#f1f5f9">AIOps &amp; Monitoring</text>
  </g>

  <!-- Pill 5: Endpoint & RMM -->
  <g transform="translate(910, 292)">
    <rect width="170" height="42" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="22" cy="21" r="6" fill="#f59e0b" />
    <text x="38" y="26" class="pill-text" fill="#f1f5f9">Remote Desk &amp; RMM</text>
  </g>
</svg>
